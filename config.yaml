project:
  name: "energy-price-agents-mibel-pt"
  version: "1.0.0"
  description: "Previsão e explicabilidade do preço horário da eletricidade no mercado diário MIBEL (zona Portugal) com CRISP-DM, XGBoost e SHAP."
  language: "pt-PT"
  timezone_utc: "UTC"
  timezone_local: "Europe/Lisbon"

execution_environment:
  mode: "local" # Execução 100% Local (Ambiente Antigravity / Python)
  description: "Modelo de treino e inferência executado integralmente no ambiente local, sem necessidade de instâncias ou volumes externos de cloud."
  manifest_path: "data/processed/manifest.json"

temporal_settings:
  dataset_start: "2024-01-01"
  dataset_end: "2026-09-30"
  target_resolution: "1h"
  sdac_15min_transition_date: "2025-10-01" # Data de entrada em vigor das 96 MTU de 15 min no SDAC/MIBEL
  aggregation_rule_15min_to_1h: "arithmetic_mean" # Média dos 4 períodos de 15 min do bloco horário

ml_framing:
  approved_framing: "regression_hourly_price" # Proposta aprovada no Checkpoint Humano A
  alternative_framings:
    - id: "regression_hourly_price"
      name: "Regressão do Preço Horário (€/MWh)"
      description: "Previsão direta do valor contínuo do preço marginal horario para Portugal."
      pros: "Mapeamento direto do custo real de eletricidade; permite cálculo de dispatch, receita e hedging."
      cons: "Sensível a picos extremos e preços negativos (necessita regularização robusta)."
      recommended: true
    - id: "classification_peaks_and_negatives"
      name: "Classificação Multiclasse de Regimes de Preço"
      description: "Classificação em classes: Preço Negativo (<=0€), Preço Normal (0-150€), Pico Alto (>150€)."
      pros: "Foco no risco operacional e ativação de flexibilidade de baterias/bombagem."
      cons: "Perde granularidade do preço exato necessário para reconciliação financeira."
      recommended: false
  target_column: "price_pt_eur_mwh"
  primary_metrics:
    - "mae"
    - "rmse"
  secondary_metrics:
    - "r2"

temporal_splits:
  train:
    start: "2024-01-01"
    end: "2025-06-30"
    description: "Período de treino (1 ano e meio - 18 meses)"
  validation:
    start: "2025-07-01"
    end: "2025-12-31"
    description: "Período de validação e afinação de hiperparâmetros (6 meses)"
  test:
    start: "2026-01-01"
    end: "2026-09-30"
    description: "Período de teste cego fora da amostra (9 meses - avaliado uma única vez)"

data_sources:
  entsoe:
    name: "ENTSO-E Transparency Platform"
    relevance_score: 4.8
    approved: true
    bidding_zone: "10YPT-REN------W"
    domain_in: "10YPT-REN------W"
    domain_out: "10YPT-REN------W"
    license: "Creative Commons Attribution 4.0 International (CC-BY 4.0)"
    api_endpoint: "https://web-api.tp.entsoe.eu/api"
    document_types:
      day_ahead_prices: "A44"
      actual_generation_per_type: "A75"
      actual_load: "A65"
  open_meteo:
    name: "Open-Meteo Historical & Forecast Weather API"
    relevance_score: 4.6
    approved: true
    license: "Creative Commons Attribution 4.0 International (CC-BY 4.0)"
    api_endpoint: "https://archive-api.open-meteo.com/v1/archive"
    locations:
      lisbon:
        lat: 38.72
        lon: -9.14
        weight: 0.40 # Ponderação populacional e consumo
      porto:
        lat: 41.15
        lon: -8.61
        weight: 0.35 # Norte industrial e hídrico
      central_pt:
        lat: 39.80
        lon: -7.90
        weight: 0.25 # Região solar e eólica interior
    variables:
      - "temperature_2m"
      - "wind_speed_100m"
      - "direct_radiation"
      - "cloud_cover"
  omie:
    name: "OMIE (Operador de Mercado Ibérico de Electricidade)"
    relevance_score: 4.5
    approved: true
    license: "Termos de uso OMIE - Dados públicos de mercado para estudo e investigação"
    file_prefix: "marginalp"
  commodities:
    name: "Mercados Globais de Gás TTF e Licenças de Carbono (EUA)"
    relevance_score: 4.1
    approved: true
    ttf_gas_source: "ICE Dutch TTF Natural Gas (TTF=F)"
    eua_carbon_source: "EUA Carbon Futures (Investing/ICE/Yahoo Proxy)"

quality_gates:
  max_missing_ratio_target: 0.0
  max_missing_ratio_feature_initial: 0.05
  max_missing_ratio_feature_final: 0.0
  max_api_retries: 3
  api_retry_backoff_factor: 2.0
  max_agent_loop_iterations: 3

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  reports: "reports"
  logs: "logs"
  src: "src"
